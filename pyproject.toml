[project]
name = "todo-harness"
version = "0.1.0"
description = "Reconcile a task tracker against what is actually true, on a schedule."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
harness = "harness.runners.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
